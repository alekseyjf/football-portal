packages:
  - "apps/*"
  - "packages/*"

# Нову версію пакета (і транзитивну теж) pnpm бере не раніше ніж через 7 днів після публікації — значення
# у хвилинах; діє, коли pnpm підбирає версію (add, update, новий запис у lock-файлі). Зламаний реліз npm
# зазвичай знімають за години–дні, а dev-залежності виконуються на машині з .env (M1.3.2)
minimumReleaseAge: 10080
# Терміновий патч безпеки — точну версію сюди, а коли їй мине 7 днів, рядок прибрати:
# minimumReleaseAgeExclude:
#   - next@16.2.5